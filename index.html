<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>1D Collision Lab I</title>
<style>
:root{
  --bg:#0B1A2B; --panel:#0E2136; --panel2:#12294A; --line:#2A3F5C; --grid:rgba(140,170,210,.07);
  --text:#F2EEE3; --muted:#9AA8BC; --green:#7FD4A8; --amber:#E8B23A; --bad:#F08A8A;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:34px 34px;
  color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Sarabun","Noto Sans Thai",sans-serif;
  height:100dvh;display:flex;flex-direction:column;overflow:hidden;
}
.mono{font-family:var(--mono)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
header .tt{flex:1;min-width:0}
header h1{margin:0;font-size:19px;font-weight:700;user-select:none}
header .sub{font-size:13px;color:var(--muted);margin-top:2px}
.obtn{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:15px;font-family:inherit;cursor:pointer;min-width:52px}
.obtn.on{border-color:var(--amber);color:var(--amber)}
main{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;padding:0 14px 10px}
#stage{position:relative;flex:1 1 auto;min-height:220px}
#cv{position:absolute;inset:0;width:100%;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px 18px;padding:8px 0;border-top:1px solid var(--line)}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;max-width:100%;overflow-x:auto;scrollbar-width:none}
.grp .gl{font-family:var(--mono);font-size:13px;color:var(--muted);margin-right:2px;white-space:nowrap}
.chip{font-family:var(--mono);font-size:15px;background:var(--panel);color:var(--text);border:1.5px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.chip.sel{border-color:var(--green);color:var(--green);background:rgba(127,212,168,.08)}
.chip:disabled{opacity:.45;cursor:not-allowed}
#list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:28px minmax(90px,1.1fr) 1fr 1fr 30px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.row .n{font-family:var(--mono);color:var(--muted)}
.row .set{font-family:var(--mono);font-size:13px;color:var(--muted);line-height:1.4}
.cell input{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-family:var(--mono);font-size:17px}
.cell input::placeholder{color:#5D6E86}
.cell input:disabled{opacity:.6}
.cell .v{font-family:var(--mono);font-size:13px;color:var(--green);margin-top:3px;min-height:16px}
.cell .ans{font-family:var(--mono);font-size:12px;color:var(--amber);display:none}
body.teacher .cell .ans{display:block}
.x{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
.listTop{display:flex;justify-content:flex-end;gap:8px;padding-top:6px}
.lnk{background:none;border:none;color:var(--muted);font-family:var(--mono);font-size:12px;cursor:pointer;text-decoration:underline}
footer{border-top:1px solid var(--line);background:rgba(11,26,43,.96);padding:8px 14px calc(6px + env(safe-area-inset-bottom))}
.swbar{display:flex;align-items:center;justify-content:center;gap:12px 22px;flex-wrap:wrap}
.cmd{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 18px;font-size:17px;font-family:inherit;cursor:pointer}
.sw{display:flex;align-items:center;gap:8px}
.swCol{display:flex;flex-direction:column;align-items:center}
.sw3 .swTime{font-size:24px;min-width:118px} .sw3 .play{width:58px;height:50px} .sw3 .rst{width:46px;height:50px} .sw3 .swn{font-size:20px}
.swbar.three .cmd{order:-1}
@media (max-width:1100px){ .swbar.three .cmd{width:100%;padding:9px} .swbar.three{gap:8px 14px} .sw3{gap:6px} .sw3 .swTime{font-size:21px;min-width:104px} .sw3 .play{width:50px;height:46px} .sw3 .rst{width:42px;height:46px} }
.swHist{font-family:var(--mono);font-size:13px;color:var(--muted);min-height:16px;white-space:nowrap}
.swn{font-family:var(--mono);font-size:22px}
.swTime{font-family:var(--mono);font-size:28px;font-weight:600;min-width:140px;text-align:center;letter-spacing:.5px}
.swTime.run{color:var(--green)}
.play{background:#3F7A5A;border:1.5px solid var(--green);color:#fff;border-radius:12px;width:76px;height:52px;font-size:22px;cursor:pointer;touch-action:manipulation}
.play.run{background:#7A5A1E;border-color:var(--amber)}
.rst{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;width:56px;height:52px;font-size:22px;cursor:pointer}
.credit{text-align:center;font-size:12px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modalBg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.modalBg.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(520px,100%);max-height:90dvh;overflow:auto}
.modal h2{margin:0 0 10px;font-size:18px}
.field{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.modal input{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:15px;font-family:var(--mono)}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.msg{font-size:13px;color:var(--amber);min-height:18px;margin-top:6px}
#linkOut{width:100%;margin-top:8px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:12px;font-family:var(--mono)}
details summary{cursor:pointer;font-size:14px;margin-top:12px}
@media (max-width:800px) and (min-width:561px){ .sw3 .swTime{font-size:19px;min-width:94px} .sw3 .play{width:46px} .sw3 .rst{width:40px} .sw3 .swn{font-size:18px} }
@media (max-width:560px){
  .swTime{font-size:22px;min-width:110px} .swbar .cmd{order:-1;width:100%} .cmd{padding:10px 12px;font-size:15px} .play{width:62px} .rst{width:48px}
  .row{grid-template-columns:22px 1fr 1fr 24px} .row .set{grid-column:2 / span 2}
  .credit{white-space:normal;font-size:11px}
}
</style>
</head>
<body>
<header>
  <div class="tt" id="titleBox"><h1 data-i="title"></h1><div class="sub" data-i="sub"></div></div>
  <button class="obtn mono" id="langBtn"></button>
  <button class="obtn" id="teacherBtn" data-i="teacher"></button>
</header>

<main>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div class="chips" id="chips"></div>
</main>

<footer>
  <div class="swbar three">
    <button class="cmd" id="launchBtn" data-i="launch"></button>
    <div class="sw sw3" id="sw0"><span class="swn" style="color:var(--green)">①</span><div class="swCol"><div class="swTime">00:00.00</div><div class="swHist" data-i="sl1"></div></div><button class="play">▶</button><button class="rst">↺</button></div>
    <div class="sw sw3" id="sw1"><span class="swn" style="color:var(--green)">②</span><div class="swCol"><div class="swTime">00:00.00</div><div class="swHist" data-i="sl2"></div></div><button class="play">▶</button><button class="rst">↺</button></div>
    <div class="sw sw3" id="sw2"><span class="swn" style="color:var(--amber)">③</span><div class="swCol"><div class="swTime">00:00.00</div><div class="swHist" data-i="sl3"></div></div><button class="play">▶</button><button class="rst">↺</button></div>
  </div>
  <div class="credit" id="credit"></div>
</footer>

<div class="modalBg" id="tModal"><div class="modal">
  <h2 data-i="tTitle"></h2>
  <div id="pwArea">
    <div class="mrow"><input type="password" id="pwIn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="flex:1"><button class="cmd" id="pwOk">OK</button></div>
    <div class="msg" id="pwMsg"></div>
  </div>
  <div id="tArea" style="display:none">
    <div id="ansBox" class="mono" style="color:var(--amber);font-size:14px;line-height:1.7;padding:8px 10px;border:1px solid var(--amber);border-radius:10px;margin-bottom:6px"></div>
    <div class="field"><span>e (≠ 1)</span><input type="number" id="tE" min="0.05" max="0.95" step="0.05" style="width:100px"></div>
    <div class="field"><span data-i="tVar"></span><input type="number" id="tVar" min="0" max="15" step="1" style="width:100px"></div>
    <div class="field"><span data-i="tLock"></span><input type="checkbox" id="tLock" style="transform:scale(1.3)"></div>
    <div class="mrow">
      <button class="cmd" id="tApply" data-i="tApply"></button>
      <button class="cmd" id="tLink" data-i="tLinkBtn"></button>
      <button class="cmd" id="tExit" data-i="tExit"></button>
    </div>
    <textarea id="linkOut" rows="3" readonly style="display:none"></textarea>
    <div class="msg" id="linkMsg"></div>
    <details>
      <summary data-i="pwChg"></summary>
      <div class="field"><span data-i="adEmail"></span><input type="email" id="adEmail" autocomplete="off" style="width:210px"></div>
      <div class="field"><span data-i="adPw"></span><input type="password" id="adPw" autocomplete="off" style="width:210px"></div>
      <div class="field"><span data-i="newPw"></span><input type="password" id="newPw" autocomplete="new-password" style="width:210px"></div>
      <div class="field"><span data-i="newPw2"></span><input type="password" id="newPw2" autocomplete="new-password" style="width:210px"></div>
      <div class="mrow"><button class="cmd" id="pwChgBtn" data-i="pwChgBtn"></button></div>
      <div class="msg" id="pwChgMsg"></div>
    </details>
  </div>
  <div class="mrow" style="justify-content:flex-end"><button class="cmd" id="tClose" data-i="close"></button></div>
</div></div>

<script>
const LAB=1;            // 1 = time m1 before + m2 after;  2 = set u1, time both after
const PRE='col'+LAB+'_';       // storage prefix (keeps Lab I and Lab II data separate)

/* ---------- TEXT ---------- */
const TXT={
en:{ title:"1D Collision Lab", sub:"Time to find u₁, v₁′ and v₂′", teacher:"Teacher", launch:"Launch", clear:"clear all",
  power:"P", t1:"t₁ (s) ①", t2:"t₂ (s) ②",
  sl1:"m₁ before", sl2:"m₁ after", sl3:"m₂ after", tTitle:"Teacher", ans:"Answer (last launch)", noRun:"Launch once to see the answer.", stops:"stops", tLock:"Lock masses", tVar:"Launch variation ±%", tApply:"Apply", tLinkBtn:"Student link", tExit:"Exit teacher", close:"Close",
  pwWrong:"Wrong password", applied:"Applied",
  linkCopied:"Link copied — settings are locked for students.",
  linkNull:"Open this app from the website (GitHub Pages) to create a working link.",
  pwChg:"🔑 Change password", adEmail:"Admin email", adPw:"Admin password", newPw:"New password", newPw2:"Confirm", pwChgBtn:"Change",
  pwChgOk:"Changed (this device only).", pwChgBad:"Admin email or password incorrect.", pwChgMismatch:"New passwords do not match.",
  confirmClear:"Delete all rows?",
  credit:"Asst.Prof.Dr. Rossumont Jaryabhand · Rajamangala University of Technology Tawan-ok, Uthenthawai Campus · No Right Reserved" },
th:{ title:"การชนในหนึ่งมิติ", sub:"จับเวลาหา u₁, v₁′ และ v₂′", teacher:"ครู", launch:"ปล่อย", clear:"ล้างทั้งหมด",
  power:"P", t1:"t₁ (s) ①", t2:"t₂ (s) ②",
  sl1:"m₁ ก่อนชน", sl2:"m₁ หลังชน", sl3:"m₂ หลังชน", tTitle:"ครู", ans:"เฉลย (การปล่อยครั้งล่าสุด)", noRun:"กดปล่อยก่อน จึงจะเห็นเฉลย", stops:"หยุดนิ่ง", tLock:"ล็อกมวล", tVar:"ความแปรปรวนแรงยิง ±%", tApply:"ใช้ค่านี้", tLinkBtn:"ลิงก์นักศึกษา", tExit:"ออกโหมดครู", close:"ปิด",
  pwWrong:"รหัสไม่ถูกต้อง", applied:"ใช้ค่าแล้ว",
  linkCopied:"คัดลอกลิงก์แล้ว — ค่าถูกล็อกสำหรับนักศึกษา",
  linkNull:"ต้องเปิดแอปจากหน้าเว็บ (GitHub Pages) จึงจะสร้างลิงก์ที่ใช้ได้",
  pwChg:"🔑 เปลี่ยนรหัส", adEmail:"อีเมลผู้ดูแล", adPw:"รหัสผู้ดูแล", newPw:"รหัสใหม่", newPw2:"ยืนยัน", pwChgBtn:"เปลี่ยน",
  pwChgOk:"เปลี่ยนแล้ว (เฉพาะเครื่องนี้)", pwChgBad:"อีเมลหรือรหัสผู้ดูแลไม่ถูกต้อง", pwChgMismatch:"รหัสใหม่ไม่ตรงกัน",
  confirmClear:"ลบข้อมูลทั้งหมด?",
  credit:"ผศ.ดร.รสสุมนต์ จารยะพันธุ์ · มหาวิทยาลัยเทคโนโลยีราชมงคลตะวันออก อุเทนถวาย · ไม่สงวนลิขสิทธิ์" }
};

/* ---------- PASSWORD (stored as fingerprints only) ---------- */
function sha256(str){
  const bytes=Array.from(new TextEncoder().encode(str));
  const rr=(v,n)=>(v>>>n)|(v<<(32-n)), H=[], K=[];
  const isPrime=n=>{for(let f=2;f*f<=n;f++) if(n%f===0) return false; return true;};
  for(let p=2,c=0;c<64;p++){ if(isPrime(p)){ if(c<8) H[c]=(Math.pow(p,1/2)*4294967296)|0; K[c]=(Math.pow(p,1/3)*4294967296)|0; c++; } }
  const l=bytes.length*8; bytes.push(0x80); while(bytes.length%64!==56) bytes.push(0);
  for(let i=7;i>=0;i--) bytes.push(i>=4?0:(l>>>(i*8))&255);
  for(let j=0;j<bytes.length;j+=64){
    const w=[];
    for(let i=0;i<16;i++) w[i]=(bytes[j+4*i]<<24)|(bytes[j+4*i+1]<<16)|(bytes[j+4*i+2]<<8)|bytes[j+4*i+3];
    for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2]; w[i]=(w[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+w[i-7]+(rr(b,17)^rr(b,19)^(b>>>10)))|0;}
    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){
      const t1=(h+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0;
      const t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b)^(a&c)^(b&c)))|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    [a,b,c,d,e,f,g,h].forEach((v,k)=>H[k]=(H[k]+v)|0);
  }
  return H.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('');
}
// iPad/Mac keyboards may turn ' into ‘ or ’ — treat them all the same
const normPw=s=>String(s||'').trim().replace(/[‘’‚‛′`´]/g,"'").replace(/[“”„]/g,'"');
const DEFAULT_PW_HASH='8db889767c2c37605279743265bbe7e417a602cf63627e30551165e1f9f68e2e';
const ADMIN_EMAIL_HASH='ba9141f018cca7df16a1eea2690318299afde0145a9cf3c21f4779f54d48b307';
const ADMIN_PW_HASH='4ad33163e0911114959530cf0d6f3bab6bcf572c5ae3c768d94c1510d8370dfd';


/* ---------- STORAGE ---------- */
const store={get(k,d){try{const v=localStorage.getItem(PRE+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
             set(k,v){try{localStorage.setItem(PRE+k,JSON.stringify(v));}catch(e){}}};

/* ---------- STATE ---------- */
const MASSES=[100,200,300,400,500];
const POWER=[0.10,0.15,0.20,0.25,0.30,0.35,0.40,0.45,0.50,0.55];   // Lab I, m/s
const U1S=[0.10,0.15,0.20,0.25,0.30,0.40,0.50];                    // Lab II, m/s
const W=0.14, X1_0=0.10, X2_0=1.05, END=2.0, SPRING=0.09;
const LINES={s1:0.30,e1:0.80,s2:1.25,e2:1.75}, D=0.50;

let lang=store.get('lang','en');
let S=Object.assign({m1:200,m2:200,e:0.60,vari:0,lock:false,ec:1,p:4,u:0.25},store.get('set',{}));
let pwHash=store.get('pwh',DEFAULT_PW_HASH);
let urlLocked=false, teacher=false;
(function(){try{const k=new URLSearchParams(location.search).get('k'); if(!k) return;
  const s=JSON.parse(decodeURIComponent(atob(k.slice(16).split('').reverse().join(''))));
  S=Object.assign(S,s); urlLocked=true;}catch(e){}})();
const saveS=()=>{ if(!urlLocked) store.set('set',S); };
const t=k=>TXT[lang][k]??k;
const $=id=>document.getElementById(id);
const locked=()=>urlLocked&&S.lock&&!teacher;
const eNow=()=>S.ec===1?1:+S.e;
const fmt=(v,d=3)=>isFinite(v)?v.toFixed(d):'–';

/* ---------- CHIPS ---------- */
function chipGroup(label,vals,cur,show,onPick,dis){
  const g=document.createElement('div'); g.className='grp';
  g.innerHTML=`<span class="gl">${label}</span>`;
  vals.forEach(v=>{const b=document.createElement('button'); b.className='chip'+(v===cur?' sel':''); b.textContent=show(v);
    b.disabled=!!dis; b.onclick=()=>{onPick(v); renderChips(); resetCarts();}; g.appendChild(b);});
  return g;
}
function renderChips(){
  const c=$('chips'); c.innerHTML='';
  c.appendChild(chipGroup('e',[1,2],S.ec,v=>v===1?'1':'≠ 1',v=>S.ec=v));
  c.appendChild(chipGroup('m₁ g',MASSES,S.m1,v=>v,v=>{S.m1=v;saveS();},locked()));
  c.appendChild(chipGroup('m₂ g',MASSES,S.m2,v=>v,v=>{S.m2=v;saveS();},locked()));
  if(LAB===1) c.appendChild(chipGroup('P',POWER.map((_,i)=>i+1),S.p,v=>v,v=>{S.p=v;saveS();}));
  else c.appendChild(chipGroup('u₁ m/s',U1S,S.u,v=>v.toFixed(2),v=>{S.u=v;saveS();}));
}

/* ---------- SIMULATION ---------- */
let sim, lastRun=null;
function resetCarts(){ sim={state:'ready',x1:X1_0,x2:X2_0,v1:0,v2:0,collided:false,glow:{},t:0}; }
function theory(m1,m2,e,u1){ return {v1:(m1-e*m2)*u1/(m1+m2), v2:(1+e)*m1*u1/(m1+m2)}; }
function launch(){
  const e=eNow(), m1=S.m1, m2=S.m2;
  let u1= LAB===1 ? POWER[S.p-1]*(1+(Math.random()*2-1)*S.vari/100) : S.u;
  const th=theory(m1,m2,e,u1);
  resetCarts(); sim.state='run'; sim.v1=u1; sim.v1p=th.v1; sim.v2p=th.v2; lastRun={u1,v1:th.v1,v2:th.v2,m1,m2,e};
}
function crossed(a,b,l){return (a<l&&b>=l)||(a>l&&b<=l);}
function step(dt){
  if(sim.state!=='run') return;
  sim.t+=dt; const p1=sim.x1,p2=sim.x2;
  sim.x1+=sim.v1*dt; sim.x2+=sim.v2*dt;
  if(!sim.collided && sim.x2-sim.x1<=W){ sim.collided=true; sim.x1=sim.x2-W; sim.v1=sim.v1p; sim.v2=sim.v2p; }
  if(sim.collided){
    if(sim.x2>=END-W/2){sim.x2=END-W/2; sim.v2=0;}
    if(sim.x1>sim.x2-W){sim.x1=sim.x2-W; sim.v1=0;}
    if(sim.x1<SPRING+W/2 && sim.v1<0){sim.x1=SPRING+W/2; sim.v1=0;}
  }
  const now=performance.now();
  [[p1,sim.x1,'a'],[p2,sim.x2,'b']].forEach(([pa,xa,id])=>Object.keys(LINES).forEach(k=>{
    if(crossed(pa,xa,LINES[k])&&!sim.glow[k+id]){sim.glow[k]=now;sim.glow[k+id]=1;}}));
  if((sim.collided&&sim.v1===0&&sim.v2===0)||sim.t>300) sim.state='done';
}

/* ---------- DRAW ---------- */
const cv=$('cv'), ctx=cv.getContext('2d'); let CW=0,CH=0;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let C={};
function resize(){ const r=cv.getBoundingClientRect(); if(!r.width) return; const d=devicePixelRatio||1;
  CW=r.width; CH=r.height; cv.width=CW*d; cv.height=CH*d; ctx.setTransform(d,0,0,d,0,0);
  C={g:css('--green'),a:css('--amber'),t:css('--text'),m:css('--muted'),l:css('--line'),mono:css('--mono')}; }
new ResizeObserver(resize).observe($('stage'));
function draw(){
  if(!CW||!sim) return; ctx.clearRect(0,0,CW,CH);
  const mx=26, sx=(CW-2*mx)/END, X=x=>mx+x*sx;
  const trackY=Math.max(120,Math.min(CH-56,CH*0.74)), cartH=Math.max(30,Math.min(64,CH*0.16)), now=performance.now();
  const mono=s=>`${s}px ${C.mono}`;
  // zones
  [['s1','e1','①',C.g],['s2','e2','②',C.a]].forEach(([a,b,lab,col])=>{
    [a,b].forEach(k=>{const x=X(LINES[k]), gl=sim.glow[k]&&now-sim.glow[k]<350;
      ctx.strokeStyle=col; ctx.lineWidth=gl?5:1.6; ctx.setLineDash(gl?[]:[6,6]); if(gl){ctx.shadowColor=col;ctx.shadowBlur=18;}
      ctx.beginPath(); ctx.moveTo(x,30); ctx.lineTo(x,trackY); ctx.stroke(); ctx.shadowBlur=0; ctx.setLineDash([]);});
    const y=44, xa=X(LINES[a]), xb=X(LINES[b]);
    ctx.strokeStyle=col; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(xa,y); ctx.lineTo(xb,y); ctx.stroke();
    ctx.fillStyle=col; ctx.font=mono(13); ctx.textAlign='center'; ctx.fillText(lab+'  0.50 m',(xa+xb)/2,y-7);
  });
  // track + ruler
  ctx.fillStyle='#2E4462'; ctx.fillRect(X(0),trackY,X(END)-X(0),6);
  ctx.fillStyle='#5A6F8C'; ctx.fillRect(X(END)-3,trackY-cartH-8,6,cartH+14); ctx.fillRect(X(0)-5,trackY-cartH-6,6,cartH+12);
  ctx.strokeStyle=C.m; ctx.fillStyle=C.m; ctx.lineWidth=1; ctx.font=mono(11);
  for(let i=0;i<=40;i++){const x=X(i*0.05); const big=i%4===0; ctx.beginPath(); ctx.moveTo(x,trackY+9); ctx.lineTo(x,trackY+(big?19:14)); ctx.stroke();
    if(big&&(CW>480||i%8===0)) ctx.fillText((i*0.05).toFixed(1),x,trackY+32);}
  ctx.textAlign='right'; ctx.fillText('m',X(END),trackY+46); ctx.textAlign='center';
  // spring
  const lx0=X(0), lx1=X(Math.min(sim.x1-W/2,SPRING)), ly=trackY-cartH/2;
  ctx.strokeStyle='#B9C3D1'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(lx0,ly);
  if(lx1-lx0>4){for(let i=1;i<=6;i++) ctx.lineTo(lx0+(lx1-lx0)*(i-0.5)/6, ly+(i%2?-6:6)); ctx.lineTo(lx1,ly);} ctx.stroke();
  // carts
  [[sim.x1,S.m1,C.g],[sim.x2,S.m2,C.a]].forEach(([x,m,col])=>{
    const l=X(x-W/2), w=W*sx, top=trackY-cartH;
    ctx.fillStyle=col; ctx.beginPath(); ctx.roundRect?ctx.roundRect(l,top,w,cartH,6):ctx.rect(l,top,w,cartH); ctx.fill();
    const txt=m+' g'; let fs=16; do{ctx.font='bold '+mono(fs); if(ctx.measureText(txt).width<=w-6) break; fs--;}while(fs>7);
    ctx.fillStyle='#0B1A2B'; ctx.textBaseline='middle'; ctx.fillText(txt,X(x),top+cartH/2+1); ctx.textBaseline='alphabetic';
    ctx.strokeStyle=C.t; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(X(x),top); ctx.lineTo(X(x),top-24); ctx.stroke();
    ctx.fillStyle=C.t; ctx.beginPath(); ctx.moveTo(X(x),top-24); ctx.lineTo(X(x)+10,top-19); ctx.lineTo(X(x),top-14); ctx.fill();
  });
}

/* ---------- STOPWATCHES (real time, 1:1) ---------- */
// each ▶ after a stop starts a NEW timing from zero; earlier results stay listed under the clock (newest first)
const sws=[...document.querySelectorAll('.sw')].map(el=>({el,run:false,t0:0,acc:0,hist:[]}));
const SHOW_HIST=sws.length===2;  // 2 clocks: keep earlier results; 3 clocks: one value per clock
const swNow=w=>w.acc+(w.run?(performance.now()-w.t0)/1000:0);
function swShow(w){ const v=swNow(w), m=Math.floor(v/60), s=v-m*60;
  w.el.querySelector('.swTime').textContent=String(m).padStart(2,'0')+':'+s.toFixed(2).padStart(5,'0');
  if(SHOW_HIST) w.el.querySelector('.swHist').textContent=w.hist.slice(w.run?0:1,4).map(x=>x.toFixed(2)).join(' · '); }
function swPaint(w){ const p=w.el.querySelector('.play'); p.textContent=w.run?'■':'▶'; p.classList.toggle('run',w.run); w.el.querySelector('.swTime').classList.toggle('run',w.run); swShow(w); }
function swToggle(i){ const w=sws[i];
  if(w.run){ w.acc=swNow(w); w.run=false; w.hist.unshift(w.acc); w.hist=w.hist.slice(0,4); }
  else { w.acc=0; w.t0=performance.now(); w.run=true; }
  swPaint(w); }
function swReset(i){ const w=sws[i]; w.run=false; w.acc=0; w.hist=[]; swPaint(w); }
sws.forEach((w,i)=>{ w.el.querySelector('.play').addEventListener('pointerdown',e=>{e.preventDefault(); swToggle(i);});
  w.el.querySelector('.rst').onclick=()=>swReset(i); });
$('launchBtn').onclick=launch;
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
  if(['1','2','3'].includes(e.key) && sws[+e.key-1]) swToggle(+e.key-1); else if(e.key==='l'||e.key==='L') launch();
});

/* ---------- LANGUAGE ---------- */
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));
  $('langBtn').textContent= lang==='en'?'ไทย':'EN';
  $('credit').textContent=t('credit');
  $('teacherBtn').classList.toggle('on',teacher);
  renderChips();
}
$('langBtn').onclick=()=>{lang=lang==='en'?'th':'en'; store.set('lang',lang); applyLang();};

/* ---------- TEACHER ---------- */
function openT(){ $('tModal').classList.add('on'); $('pwMsg').textContent=''; $('pwIn').value=''; $('linkMsg').textContent=''; $('linkOut').style.display='none';
  $('pwArea').style.display=teacher?'none':'block'; $('tArea').style.display=teacher?'block':'none'; if(teacher) loadT(); else setTimeout(()=>$('pwIn').focus(),50); }
$('teacherBtn').onclick=openT;
$('tClose').onclick=()=>$('tModal').classList.remove('on');
function tryPw(){ if(sha256(normPw($('pwIn').value))===pwHash){ teacher=true; document.body.classList.add('teacher'); $('pwArea').style.display='none'; $('tArea').style.display='block'; loadT(); applyLang(); }
  else $('pwMsg').textContent=t('pwWrong'); }
$('pwOk').onclick=tryPw; $('pwIn').onkeydown=e=>{if(e.key==='Enter') tryPw();};
function renderAns(){
  const b=$('ansBox'); if(!lastRun){ b.textContent=t('noRun'); return; }
  const r=lastRun, tt=v=>Math.abs(v)<1e-9?'– ('+t('stops')+')':(D/Math.abs(v)).toFixed(2)+' s';
  b.innerHTML=`<b>${t('ans')}</b><br>m₁ ${r.m1} g · m₂ ${r.m2} g · e ${r.e===1?'1':r.e.toFixed(2)}<br>u₁ = ${r.u1.toFixed(3)} m/s`+
    ` · t₁ = ${tt(r.u1)}`+
    `<br>v₁′ = ${r.v1.toFixed(3)} m/s`+` · t₁′ = ${tt(r.v1)}`+
    `<br>v₂′ = ${r.v2.toFixed(3)} m/s · t₂′ = ${tt(r.v2)}`;
}
function loadT(){ renderAns(); $('tE').value=S.e; if($('tVar')) $('tVar').value=S.vari; $('tLock').checked=!!S.lock; }
function readT(){ S.e=Math.min(0.95,Math.max(0.05,parseFloat($('tE').value)||0.6));
  if($('tVar')) S.vari=Math.min(15,Math.max(0,parseFloat($('tVar').value)||0)); S.lock=$('tLock').checked; saveS(); loadT(); }
$('tApply').onclick=()=>{ readT(); renderChips(); resetCarts(); $('linkMsg').textContent=t('applied'); };
$('tExit').onclick=()=>{ teacher=false; document.body.classList.remove('teacher'); applyLang(); $('tModal').classList.remove('on'); };
$('tLink').onclick=()=>{
  readT(); renderChips();
  const s={m1:S.m1,m2:S.m2,e:S.e,vari:S.vari,lock:S.lock};
  let salt=''; const ch='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; for(let i=0;i<16;i++) salt+=ch[Math.floor(Math.random()*ch.length)];
  const url=location.origin+location.pathname+'?k='+encodeURIComponent(salt+btoa(encodeURIComponent(JSON.stringify(s))).split('').reverse().join(''));
  $('linkOut').style.display='block'; $('linkOut').value=url;
  if(location.origin==='null'||location.protocol==='file:'){ $('linkMsg').textContent=t('linkNull'); return; }
  const done=()=>$('linkMsg').textContent=t('linkCopied');
  if(navigator.clipboard) navigator.clipboard.writeText(url).then(done,()=>{$('linkOut').select();document.execCommand('copy');done();}); else {$('linkOut').select();document.execCommand('copy');done();}
};
$('pwChgBtn').onclick=()=>{
  const m=$('pwChgMsg');
  if(sha256($('adEmail').value.trim().toLowerCase())!==ADMIN_EMAIL_HASH || sha256(normPw($('adPw').value))!==ADMIN_PW_HASH){ m.textContent=t('pwChgBad'); return; }
  const a=normPw($('newPw').value), b=normPw($('newPw2').value);
  if(!a||a!==b){ m.textContent=t('pwChgMismatch'); return; }
  pwHash=sha256(a); store.set('pwh',pwHash); ['adEmail','adPw','newPw','newPw2'].forEach(id=>$(id).value=''); m.textContent=t('pwChgOk');
};

/* ---------- START ---------- */
resetCarts(); applyLang(); resize(); sws.forEach(swShow);
let last=performance.now();
(function loop(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; for(let i=0;i<4;i++) step(dt/4); draw(); sws.forEach(w=>{if(w.run) swShow(w);}); requestAnimationFrame(loop); })(last);
</script>
