<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>1D Collision Lab II</title>
<style>
:root{
  --bg:#0b1220; --card:#111a2e; --card2:#16223b; --line:#24324f; --text:#e5ecf6; --muted:#93a4c3;
  --accent:#22c55e; --z1:#38bdf8; --z2:#f472b6; --m1:#60a5fa; --m2:#fb923c; --warn:#fbbf24; --bad:#f87171;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;}
body{
  background:var(--bg);
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Sarabun","Noto Sans Thai",Roboto,sans-serif;
  height:100dvh;display:flex;flex-direction:column;overflow:hidden;
}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(17,26,46,.95);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1;min-width:180px;user-select:none}
header h1 small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.btn{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:15px;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn.primary{background:#15803d;border-color:#16a34a}
.btn.danger{background:#7f1d1d;border-color:#b91c1c}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
nav.tabs{display:flex;gap:6px;padding:8px 12px 0}
nav.tabs button{flex:1;background:transparent;border:1px solid var(--line);border-bottom:none;color:var(--muted);padding:10px;border-radius:10px 10px 0 0;font-size:15px;font-family:inherit;cursor:pointer}
nav.tabs button.on{background:var(--card);color:var(--text);font-weight:600}
main{flex:1;min-height:0;padding:0 12px 12px;display:flex;flex-direction:column}
.tab{display:none;flex:1;min-height:0;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:0 0 12px 12px;padding:12px}
.tab.on{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px}
.card h3{margin:0 0 8px;font-size:15px;color:var(--muted);font-weight:600}
#expCard{flex:1;display:flex;flex-direction:column;min-height:420px;padding:10px}
#canvasWrap{position:relative;flex:1;min-height:200px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%}
#statusBadge{position:absolute;right:10px;bottom:8px;font-size:13px;color:var(--muted);background:rgba(11,18,32,.7);padding:3px 8px;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label.opt{display:flex;gap:8px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;font-size:14px}
label.opt input{margin-top:3px;transform:scale(1.2)}
select,input[type=number],input[type=text],input[type=password],input[type=email]{background:#0b1220;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:15px;font-family:inherit}
.kv{font-size:14px;color:var(--muted)} .kv b{color:var(--text)}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swBox{border-radius:12px;padding:10px;text-align:center;border:2px solid var(--line);background:#0b1220}
.swBox.z1{border-color:var(--z1)} .swBox.z2{border-color:var(--z2)}
.swBox .lbl{font-size:13px;color:var(--muted)}
.swBox .time{font-size:30px;font-variant-numeric:tabular-nums;font-weight:700;margin:4px 0}
.swBox.run .time{color:var(--accent)}
.swBtn{width:100%;padding:12px 8px;font-size:17px;border-radius:12px;border:none;color:#fff;font-weight:700;font-family:inherit;cursor:pointer;touch-action:manipulation}
.z1 .swBtn{background:#0369a1} .z2 .swBtn{background:#be185d}
.swBox.run .swBtn{background:#b91c1c}
.msg{font-size:14px;min-height:20px;color:var(--warn)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:6px 6px;text-align:center;white-space:nowrap}
th{background:#0b1220;color:var(--muted);font-weight:600;white-space:normal;min-width:56px}
td input{width:90px;text-align:center}
.tblWrap{overflow-x:auto}
.teacherOnly{display:none!important}
body.teacher .teacherOnly{display:revert!important}
body.teacher th.teacherOnly,body.teacher td.teacherOnly{display:table-cell!important;background:rgba(251,191,36,.08);color:var(--warn)}
.guide h2{font-size:18px;margin:4px 0 8px}
.guide h3{color:var(--z1)}
.guide ol,.guide ul{margin:6px 0;padding-left:22px;line-height:1.6}
.formula{background:#0b1220;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;font-size:16px;line-height:1.8;overflow-x:auto}
.credit{text-align:center;font-size:12px;color:var(--muted);line-height:1.6;margin-top:6px}
.modalBg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.modalBg.on{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(560px,100%);max-height:90dvh;overflow:auto}
.modal h2{margin:0 0 10px;font-size:18px}
.field{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
#linkOut{width:100%;font-size:12px;margin-top:6px}
.lockNote{font-size:12px;color:var(--warn)}
.bigIn{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bigIn label{display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--muted);font-weight:600}
.bigIn select,.bigIn input{font-size:24px;padding:10px;font-weight:700;width:100%;min-width:0}
.condRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
label.opt.sm{font-size:13px;padding:6px 10px;margin:0;align-items:center}
label.opt.sm input{margin-top:0;transform:none}
@media (max-width:520px){.swBox .time{font-size:28px} header h1{font-size:15px}}
</style>
</head>
<body>
<header>
  <h1 id="title"><span data-i="title"></span><small data-i="subtitle"></small></h1>
  <button class="btn small" id="langBtn">ไทย</button>
  <button class="btn small" id="fsBtn" data-i="fullscreen"></button>
  <button class="btn small" id="teacherBtn" data-i="teacher"></button>
</header>
<nav class="tabs">
  <button data-tab="exp" class="on" data-i="tabExp"></button>
  <button data-tab="data" data-i="tabData"></button>
  <button data-tab="guide" data-i="tabGuide"></button>
</nav>
<main>
  <!-- EXPERIMENT -->
  <section class="tab on" id="tab-exp">
    <div class="card" id="expCard">
      <div id="canvasWrap"><canvas id="cv"></canvas><div id="statusBadge"></div></div>
      <div class="sw">
        <div class="swBox z1" id="sw1"><div class="lbl" data-i="sw1lbl"></div><div class="time">0.00 s</div><button class="swBtn" data-i="startStop"></button></div>
        <div class="swBox z2" id="sw2"><div class="lbl" data-i="sw2lbl"></div><div class="time">0.00 s</div><button class="swBtn" data-i="startStop"></button></div>
      </div>
      <div class="row" style="margin-top:8px;justify-content:center">
        <button class="btn primary" id="launchBtn" data-i="launch"></button>
        <button class="btn" id="resetBtn" data-i="reset"></button>
        <button class="btn" id="swReset" data-i="swReset"></button>
        <button class="btn primary" id="saveBtn" data-i="save"></button>
        <span class="msg" id="msg"></span>
      </div>
    </div>
    <div class="grid">
      <div class="card">
        <h3 data-i="setup"></h3>
        <div class="bigIn">
          <label><span>m₁</span><select id="m1Sel"></select></label>
          <label><span>m₂</span><select id="m2Sel"></select></label>
          <label><span>u₁ (m/s)</span><input type="number" id="u1In" min="0.05" max="0.60" step="0.01" value="0.25" inputmode="decimal"></label>
        </div>
        <div class="lockNote" id="lockNote"></div>
        <div class="condRow">
          <label class="opt sm"><input type="radio" name="cond" value="1" checked><span data-i="cond1"></span></label>
          <label class="opt sm"><input type="radio" name="cond" value="2"><span><span data-i="cond2"></span><b id="eShow"></b></span></label>
        </div>
        <div class="row" style="margin-top:8px">
          <label class="row kv" style="gap:4px"><input type="checkbox" id="strobe"> <span data-i="strobe"></span></label>
        </div>
        <div class="kv" style="margin-top:8px"><span data-i="dists"></span></div>
        <div class="kv" style="margin-top:6px" data-i="keys"></div>
        <div class="teacherOnly card" style="margin-top:8px" id="truthBox"></div>
      </div>
    </div>
    <div class="credit" id="creditExp"></div>
  </section>

  <!-- DATA -->
  <section class="tab" id="tab-data">
    <div class="card"><h3 data-i="tbl1"></h3><div class="tblWrap" id="tbl1"></div></div>
    <div class="card"><h3><span data-i="tbl2"></span></h3><div class="tblWrap" id="tbl2"></div></div>
    <div class="row">
      <button class="btn" id="csvBtn" data-i="csv"></button>
      <button class="btn danger" id="clearBtn" data-i="clear"></button>
    </div>
    <div class="kv" data-i="dataNote"></div>
  </section>

  <!-- GUIDE -->
  <section class="tab guide" id="tab-guide"><div id="guideBox"></div></section>
</main>

<!-- TEACHER MODAL -->
<div class="modalBg" id="tModal">
  <div class="modal">
    <h2 data-i="tTitle"></h2>
    <div id="pwArea">
      <div class="row"><input type="password" id="pwIn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="flex:1"><button class="btn primary" id="pwOk">OK</button></div>
      <div class="kv" data-i="pwHint" style="margin-top:6px"></div>
      <div class="msg" id="pwMsg"></div>
    </div>
    <div id="tArea" style="display:none">
      <div class="field"><span data-i="tM1"></span><select id="tM1"></select></div>
      <div class="field"><span data-i="tM2"></span><select id="tM2"></select></div>
      <div class="field"><span data-i="tE"></span><input type="number" id="tE" min="0.05" max="0.95" step="0.05" style="width:90px"></div>
      <div class="field" style="display:none"><span data-i="tVar"></span><input type="number" id="tVar" min="0" max="15" step="1" style="width:90px"></div>
      <div class="field"><span data-i="tLock"></span><input type="checkbox" id="tLock" style="transform:scale(1.3)"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" id="tApply" data-i="tApply"></button>
        <button class="btn" id="tLink" data-i="tLinkBtn"></button>
        <button class="btn" id="tExit" data-i="tExit"></button>
      </div>
      <details style="margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:8px">
        <summary data-i="pwChg" style="cursor:pointer;font-size:14px"></summary>
        <div class="field"><span data-i="adEmail"></span><input type="email" id="adEmail" autocomplete="off" style="width:200px"></div>
        <div class="field"><span data-i="adPw"></span><input type="password" id="adPw" autocomplete="off" style="width:200px"></div>
        <div class="field"><span data-i="newPw"></span><input type="password" id="newPw" autocomplete="new-password" style="width:200px"></div>
        <div class="field"><span data-i="newPw2"></span><input type="password" id="newPw2" autocomplete="new-password" style="width:200px"></div>
        <div class="row" style="margin-top:8px"><button class="btn" id="pwChgBtn" data-i="pwChgBtn"></button></div>
        <div class="msg" id="pwChgMsg"></div>
      </details>
      <textarea id="linkOut" rows="3" readonly style="display:none;background:#0b1220;color:var(--text);border:1px solid var(--line);border-radius:8px"></textarea>
      <div class="msg" id="linkMsg"></div>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" id="tClose" data-i="close"></button></div>
  </div>
</div>

/* ======================= PASSWORD (stored as SHA-256 fingerprints, never plain text) ======================= */
function sha256(str){
  const bytes=Array.from(new TextEncoder().encode(str));
  const rr=(v,n)=>(v>>>n)|(v<<(32-n)), H=[], K=[];
  const isPrime=n=>{for(let f=2;f*f<=n;f++) if(n%f===0) return false; return true;};
  for(let p=2,c=0;c<64;p++){ if(isPrime(p)){ if(c<8) H[c]=(Math.pow(p,1/2)*4294967296)|0; K[c]=(Math.pow(p,1/3)*4294967296)|0; c++; } }
  const l=bytes.length*8; bytes.push(0x80); while(bytes.length%64!==56) bytes.push(0);
  for(let i=7;i>=0;i--) bytes.push(i>=4?0:(l>>>(i*8))&255);
  for(let j=0;j<bytes.length;j+=64){
    const w=[];
    for(let i=0;i<16;i++) w[i]=(bytes[j+4*i]<<24)|(bytes[j+4*i+1]<<16)|(bytes[j+4*i+2]<<8)|bytes[j+4*i+3];
    for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2]; w[i]=(w[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+w[i-7]+(rr(b,17)^rr(b,19)^(b>>>10)))|0;}
    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){
      const t1=(h+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0;
      const t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b)^(a&c)^(b&c)))|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    [a,b,c,d,e,f,g,h].forEach((v,k)=>H[k]=(H[k]+v)|0);
  }
  return H.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('');
}

/* ======================= SIMULATION ======================= */
let sim;
function resetCarts(){
  sim={state:'ready',x1:X1_0,x2:X2_0,v1:0,v2:0,t:0,collided:false,strobe:[],nextStrobe:0,glow:{},truth:sim?sim.truth:null};
  setStatus(); draw();
}
function launch(){
  let u1=parseFloat($('u1In').value); if(!isFinite(u1)) u1=0.25;
  u1=Math.min(0.60,Math.max(0.05,u1)); $('u1In').value=u1;
  const e= cond===1?1:+settings.e, m1=+settings.m1, m2=+settings.m2;
  const v1p=(m1-e*m2)*u1/(m1+m2), v2p=(1+e)*m1*u1/(m1+m2);
  resetCarts();
  sim.state='run'; sim.v1=u1; sim.v1p=v1p; sim.v2p=v2p;
  sim.truth={u1,v2p,v1p,t1:D1/u1,t2:D2/v2p,cond,m1,m2,e};
  swResetAll(); setStatus(); renderTruth();
}
function crossed(a,b,line){return (a<line&&b>=line)||(a>line&&b<=line);}
function step(dt){
  if(sim.state!=='run') return;
  sim.t+=dt;
  const p1=sim.x1,p2=sim.x2;
  sim.x1+=sim.v1*dt; sim.x2+=sim.v2*dt;
  if(!sim.collided && sim.x2-sim.x1<=W){
    sim.collided=true; sim.x1=sim.x2-W; sim.v1=sim.v1p; sim.v2=sim.v2p;
  }
  if(sim.collided){
    if(sim.x2>=END-W/2){sim.x2=END-W/2; sim.v2=0;}
    if(sim.x1>sim.x2-W){sim.x1=sim.x2-W; sim.v1=0;}
  }
  if(sim.collided && sim.x1<SPRING+W/2 && sim.v1<0){sim.x1=SPRING+W/2; sim.v1=0;}
  const now=performance.now();
  if(sim.collided){ // after collision only: both carts can trigger the line glow
    [[p1,sim.x1,'a'],[p2,sim.x2,'b']].forEach(([pa,xa,id])=>['s1','e1','s2','e2'].forEach(k=>{
      if(crossed(pa,xa,LINES[k])&&!sim.glow[k+id]){sim.glow[k]=now;sim.glow[k+id]=1;}}));
  }
  if(sim.t>=sim.nextStrobe){sim.strobe.push([sim.x1,sim.x2]); sim.nextStrobe+=0.1;}
  if(sim.collided && sim.v1===0 && sim.v2===0){sim.state='done'; setStatus();}
  if(sim.t>300){sim.state='done'; setStatus();}
}
function setStatus(){
  if(!sim) return;
  $('statusBadge').textContent= sim.state==='ready'?t('stReady'): sim.state==='run'?t('stRun'):t('stDone');
}

/* ======================= DRAWING ======================= */
const cv=$('cv'), ctx=cv.getContext('2d');
let CW=0,CH=0;
function resize(){
  const r=cv.getBoundingClientRect(); if(!r.width) return;
  const dpr=window.devicePixelRatio||1;
  CW=r.width; CH=r.height; cv.width=CW*dpr; cv.height=CH*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); draw();
}
new ResizeObserver(resize).observe($('canvasWrap'));
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function draw(){
  if(!CW||!sim) return;
  ctx.clearRect(0,0,CW,CH);
  const mx=22, sx=(CW-2*mx)/END, X=x=>mx+x*sx;
  const trackY=Math.min(CH*0.60, CH-70), cartH=Math.max(26,Math.min(40,CH*0.13)), now=performance.now();
  // zone lines
  const lineDef=[['s1','①',css('--z1')],['e1','①',css('--z1')],['s2','②',css('--z2')],['e2','②',css('--z2')]];
  const topY=34;
  lineDef.forEach(([k,lab,col])=>{
    const x=X(LINES[k]); const g=sim.glow[k]&&now-sim.glow[k]<350;
    ctx.strokeStyle=col; ctx.lineWidth=g?5:2; ctx.setLineDash(g?[]:[6,5]);
    if(g){ctx.shadowColor=col;ctx.shadowBlur=18;}
    ctx.beginPath(); ctx.moveTo(x,topY); ctx.lineTo(x,trackY+6); ctx.stroke();
    ctx.shadowBlur=0; ctx.setLineDash([]);
    ctx.fillStyle=col; ctx.font='bold 12px sans-serif'; ctx.textAlign='center'; ctx.fillText(lab,x,topY-6);
  });
  // distance brackets
  [['s1','e1','Zone ①  50.0 cm',css('--z1')],['s2','e2','Zone ②  50.0 cm',css('--z2')]].forEach(([a,b,lab,col])=>{
    const y=topY+14; ctx.strokeStyle=col; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(X(LINES[a]),y); ctx.lineTo(X(LINES[b]),y); ctx.stroke();
    ctx.fillStyle=col; ctx.font='12px sans-serif'; ctx.fillText(lab,(X(LINES[a])+X(LINES[b]))/2,y-4);
  });
  // track
  ctx.fillStyle='#334155'; ctx.fillRect(X(0),trackY,X(END)-X(0),8);
  ctx.fillStyle='#64748b'; ctx.fillRect(X(END)-4,trackY-cartH-6,8,cartH+14); // end bumper
  // ruler
  ctx.strokeStyle='#64748b'; ctx.fillStyle=css('--muted'); ctx.font='10px sans-serif'; ctx.lineWidth=1;
  for(let i=0;i<=40;i++){const x=X(i*0.05); const big=i%2===0; ctx.beginPath(); ctx.moveTo(x,trackY+10); ctx.lineTo(x,trackY+(big?20:15)); ctx.stroke();
    if(i%4===0&&CW>420||i%8===0) ctx.fillText((i*5)+'',x,trackY+31);}
  ctx.textAlign='right'; ctx.fillText('cm',X(END),trackY+44); ctx.textAlign='center';
  // launcher spring
  ctx.strokeStyle='#a3a3a3'; ctx.lineWidth=2; ctx.beginPath();
  const lx0=X(0), lx1=X(Math.min(sim.x1-W/2,SPRING)); const coils=6, ly=trackY-cartH/2;
  ctx.moveTo(lx0,ly);
  if(lx1-lx0>4){for(let i=1;i<=coils;i++){ctx.lineTo(lx0+(lx1-lx0)*(i-0.5)/coils, ly+(i%2?-6:6));} ctx.lineTo(lx1,ly);} ctx.stroke();
  ctx.fillStyle='#a3a3a3'; ctx.fillRect(lx1-2,ly-9,4,18);
  ctx.fillStyle='#64748b'; ctx.fillRect(lx0-4,trackY-cartH-4,6,cartH+12);
  // strobe
  if($('strobe').checked){
    sim.strobe.forEach(([a,b])=>{ctx.fillStyle=css('--m1');ctx.beginPath();ctx.arc(X(a),trackY+52,2.5,0,7);ctx.fill();
      ctx.fillStyle=css('--m2');ctx.beginPath();ctx.arc(X(b),trackY+60,2.5,0,7);ctx.fill();});
  }
  // carts
  [[sim.x1,settings.m1,css('--m1'),'m₁'],[sim.x2,settings.m2,css('--m2'),'m₂']].forEach(([x,m,col,n])=>{
    const l=X(x-W/2), w=W*sx, top=trackY-cartH;
    ctx.fillStyle=col; ctx.beginPath(); ctx.roundRect?ctx.roundRect(l,top,w,cartH,5):ctx.rect(l,top,w,cartH); ctx.fill();
    // shrink text so it always fits inside the cart
    const fit=(txt,max,bold)=>{let fs=max; do{ctx.font=(bold?'bold ':'')+fs+'px sans-serif'; if(ctx.measureText(txt).width<=w-6) break; fs--;}while(fs>7); return fs;};
    ctx.fillStyle='#0b1220'; ctx.textBaseline='middle';
    fit(m+' g',15,true); ctx.fillText(m+' g',X(x),top+cartH/2+1);
    ctx.textBaseline='alphabetic';
    // flag
    ctx.strokeStyle='#f8fafc'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(X(x),top); ctx.lineTo(X(x),top-22); ctx.stroke();
    ctx.fillStyle='#f8fafc'; ctx.beginPath(); ctx.moveTo(X(x),top-22); ctx.lineTo(X(x)+9,top-18); ctx.lineTo(X(x),top-14); ctx.fill();
  });
}
let last=performance.now();
function loop(now){
  let dt=Math.min(0.05,(now-last)/1000); last=now;
  // sub-steps for accuracy
  const n=4; for(let i=0;i<n;i++) step(dt/n);
  draw(); swTick();
  requestAnimationFrame(loop);
}

function pdiff(m,th){th=parseFloat(th); return (isFinite(th)&&Math.abs(th)>1e-9)?Math.abs(m-th)/Math.abs(th)*100:NaN;}
function renderTables(){
  [1,2].forEach(c=>{
    const rows=data[c], box=$('tbl'+c);
    if(!rows.length){box.innerHTML=`<div class="kv">${t('noData')}</div>`;return;}
    let h=`<table><tr><th>${t('trial')}</th><th>${t('m1g')}</th><th>${t('m2g')}</th><th>${t('e')}</th><th>${t('u1')}</th><th>${t('t1')}</th><th>${t('v1m')}</th><th>${t('t2')}</th><th>${t('v2m')}</th><th>${t('v1t')}</th><th>${t('v2t')}</th><th>${t('diff1')}</th><th>${t('diff2')}</th>
      <th class="teacherOnly">${t('trueV1')}</th><th class="teacherOnly">${t('trueT1')}</th><th class="teacherOnly">${t('trueV2')}</th><th class="teacherOnly">${t('trueT2')}</th><th></th></tr>`;
    let s1=0,s2=0,a1=0,n1=0,a2=0,n2=0;
    rows.forEach((r,i)=>{
      const v1=v1meas(r), v2=D2/r.t2, d1=pdiff(v1,r.th1), d2=pdiff(v2,r.th2);
      s1+=v1; s2+=v2; if(isFinite(d1)){a1+=d1;n1++;} if(isFinite(d2)){a2+=d2;n2++;}
      const inp=(k)=>`<input type="number" step="0.001" inputmode="decimal" value="${r[k]}" data-c="${c}" data-r="${i}" data-k="${k}" class="thIn" style="border-color:var(--warn)">`;
      h+=`<tr><td>${i+1}</td><td>${r.m1}</td><td>${r.m2}</td><td>${(+r.e).toFixed(2)}</td><td>${(+r.u1).toFixed(2)}</td><td>${r.t1.toFixed(2)}</td><td>${f3(v1)}</td><td>${r.t2.toFixed(2)}</td><td>${f3(v2)}</td>
      <td>${inp('th1')}</td><td>${inp('th2')}</td><td>${isFinite(d1)?d1.toFixed(1)+' %':'–'}</td><td>${isFinite(d2)?d2.toFixed(1)+' %':'–'}</td>
      <td class="teacherOnly">${f3(r.tr.v1p)}</td><td class="teacherOnly">${Math.abs(r.tr.v1p)>1e-9?(D1/Math.abs(r.tr.v1p)).toFixed(2):'–'}</td><td class="teacherOnly">${f3(r.tr.v2p)}</td><td class="teacherOnly">${r.tr.t2.toFixed(2)}</td>
      <td><button class="btn small delBtn" data-c="${c}" data-r="${i}">${t('del')}</button></td></tr>`;
    });
    h+=`<tr><th colspan="6">${t('avg')}</th><th>${f3(s1/rows.length)}</th><th></th><th>${f3(s2/rows.length)}</th><th></th><th></th><th>${n1?(a1/n1).toFixed(1)+' %':'–'}</th><th>${n2?(a2/n2).toFixed(1)+' %':'–'}</th><th class="teacherOnly" colspan="4"></th><th></th></tr></table>`;
    box.innerHTML=h;
  });
  document.querySelectorAll('.thIn').forEach(inp=>inp.onchange=()=>{data[inp.dataset.c][inp.dataset.r][inp.dataset.k]=inp.value; store.set('col2_data',data); setTimeout(renderTables,0);});
  document.querySelectorAll('.delBtn').forEach(b=>b.onclick=()=>{data[b.dataset.c].splice(+b.dataset.r,1); store.set('col2_data',data); renderTables();});
}
$('clearBtn').onclick=()=>{if(confirm(lang==='en'?'Delete all recorded data?':'ลบข้อมูลทั้งหมด?')){data={1:[],2:[]};store.set('col2_data',data);renderTables();}};
$('csvBtn').onclick=()=>{
  let s='﻿Condition,Trial,m1 (g),m2 (g),e,u1 (m/s),t1 after (s),v1 measured (m/s),t2 after (s),v2 measured (m/s),v1 theory (student),v2 theory (student),% diff v1,% diff v2\n';
  [1,2].forEach(c=>data[c].forEach((r,i)=>{const v1=v1meas(r),v2=D2/r.t2,d1=pdiff(v1,r.th1),d2=pdiff(v2,r.th2);
    s+=`${c},${i+1},${r.m1},${r.m2},${(+r.e).toFixed(2)},${r.u1},${r.t1},${v1.toFixed(4)},${r.t2},${v2.toFixed(4)},${r.th1},${r.th2},${isFinite(d1)?d1.toFixed(2):''},${isFinite(d2)?d2.toFixed(2):''}\n`;}));
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'})); a.download='collision_v2_data.csv'; a.click();
};
function renderTruth(){
  const b=$('truthBox'); const tr=sim&&sim.truth;
  b.innerHTML=`<b>${t('truth')}</b><br>`+(tr?`u₁ = ${f3(tr.u1)} m/s<br>v₁′ = ${f3(tr.v1p)} m/s • t₁′ = ${Math.abs(tr.v1p)>1e-9?(D1/Math.abs(tr.v1p)).toFixed(2)+' s':'– (m₁ stops)'}<br>v₂′ = ${f3(tr.v2p)} m/s • t₂′ = ${tr.t2.toFixed(2)} s`:'–');
}

/* ======================= TEACHER ======================= */
$('teacherBtn').onclick=()=>{
  $('tModal').classList.add('on'); $('pwMsg').textContent=''; $('pwIn').value=''; $('linkOut').style.display='none'; $('linkMsg').textContent='';
  $('pwArea').style.display=teacher?'none':'block'; $('tArea').style.display=teacher?'block':'none';
  if(teacher) loadTeacherForm(); else setTimeout(()=>$('pwIn').focus(),50);
};
$('tClose').onclick=()=>$('tModal').classList.remove('on');
function tryPw(){ if(sha256(normPw($('pwIn').value))===teacherPwHash){teacher=true; $('pwArea').style.display='none'; $('tArea').style.display='block'; loadTeacherForm(); refreshUI(); renderTables();} else $('pwMsg').textContent=t('pwWrong'); }
$('pwOk').onclick=tryPw; $('pwIn').onkeydown=e=>{if(e.key==='Enter')tryPw();};
function loadTeacherForm(){ $('tM1').value=settings.m1; $('tM2').value=settings.m2; $('tE').value=settings.e; $('tVar').value=settings.vari; $('tLock').checked=!!settings.lock; }
function readTeacherForm(){
  settings.m1=+$('tM1').value; settings.m2=+$('tM2').value;
  settings.e=Math.min(0.95,Math.max(0.05,parseFloat($('tE').value)||0.6));
  settings.vari=Math.min(15,Math.max(0,parseFloat($('tVar').value)||0));
  settings.lock=$('tLock').checked;
  if(!urlLocked) store.set('col2_settings',settings);
  loadTeacherForm();
}
$('tApply').onclick=()=>{readTeacherForm(); refreshUI(); resetCarts(); $('linkMsg').textContent=t('applied');};
$('pwChgBtn').onclick=()=>{
  const m=$('pwChgMsg');
  if(sha256($('adEmail').value.trim().toLowerCase())!==ADMIN_EMAIL_HASH || sha256(normPw($('adPw').value))!==ADMIN_PW_HASH){ m.textContent=t('pwChgBad'); return; }
  const a=normPw($('newPw').value), b=normPw($('newPw2').value);
  if(!a || a!==b){ m.textContent=t('pwChgMismatch'); return; }
  teacherPwHash=sha256(a); store.set('col2_pwh',teacherPwHash);
  ['adEmail','adPw','newPw','newPw2'].forEach(id=>$(id).value='');
  m.textContent=t('pwChgOk');
};
$('tExit').onclick=()=>{teacher=false; refreshUI(); renderTables(); $('tModal').classList.remove('on');};
$('tLink').onclick=()=>{
  readTeacherForm(); refreshUI();
  const s={m1:settings.m1,m2:settings.m2,e:settings.e,vari:settings.vari,lock:settings.lock};
  let salt=''; const ch='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  for(let i=0;i<16;i++) salt+=ch[Math.floor(Math.random()*ch.length)];
  const tok=salt+btoa(encodeURIComponent(JSON.stringify(s))).split('').reverse().join('');
  const url=location.origin+location.pathname+'?k='+encodeURIComponent(tok);
  $('linkOut').style.display='block'; $('linkOut').value=url;
  if(location.origin==='null'||location.protocol==='file:'){ $('linkMsg').textContent=t('linkNull'); return; }
  const done=()=>$('linkMsg').textContent=t('linkCopied');
  if(navigator.clipboard) navigator.clipboard.writeText(url).then(done,()=>{$('linkOut').select();document.execCommand('copy');done();});
  else{$('linkOut').select();document.execCommand('copy');done();}
};
// hidden 5-tap on title also opens teacher panel
let taps=0,tapT=0;
$('title').addEventListener('click',()=>{const n=Date.now(); taps= n-tapT<600?taps+1:1; tapT=n; if(taps>=5){taps=0;$('teacherBtn').click();}});

/* ======================= START ======================= */
resetCarts();
applyLang();
resize();
requestAnimationFrame(loop);
</script>
